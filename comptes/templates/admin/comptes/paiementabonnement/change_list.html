{% extends "admin/change_list.html" %}

{% block result_list %}
  {% if encaisse_par_mois %}
  <div class="module" style="margin-bottom: 1.5em; max-width: 420px;">
    <h2>Encaissé par mois (paiements)</h2>
    <table style="width: 100%;">
      {% for ligne in encaisse_par_mois %}
      <tr>
        <td>{{ ligne.mois|date:"F Y" }}</td>
        <td style="text-align: right;"><strong>{{ ligne.total|floatformat:0 }}</strong></td>
      </tr>
      {% endfor %}
    </table>
  </div>
  {% endif %}
  {{ block.super }}
{% endblock %}
