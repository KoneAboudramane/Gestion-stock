{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div class="module">
  <p>{{ description }}</p>
  <form method="post">
    {% csrf_token %}
    <table>
      {{ form.as_table }}
    </table>
    <div class="submit-row">
      <input type="submit" value="{{ submit_label }}" class="default">
      <a href="{{ back_url }}" class="button cancel-link">Annuler</a>
    </div>
  </form>
</div>
{% endblock %}
