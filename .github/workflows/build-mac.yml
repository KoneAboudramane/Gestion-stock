name: Build client Electron (macOS)

# Se lance uniquement à la demande (bouton "Run workflow" dans l'onglet
# "Actions" de GitHub) — pas à chaque push, pour ne pas consommer les minutes
# de build macOS inutilement.
on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client-electron
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Construire le paquet macOS (.dmg)
        # Pas de certificat de signature Apple : on désactive la recherche
        # automatique d'identité de signature, sinon electron-builder échoue.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac

      - name: Publier le résultat (téléchargeable depuis l'onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stock-mac
          path: |
            client-electron/release/*.dmg
            client-electron/release/*.zip
          if-no-files-found: error
